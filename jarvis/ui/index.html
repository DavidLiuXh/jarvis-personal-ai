<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jarvis - Personal AI Assistant</title>
    <!-- Libraries for Markdown, Math and Highlighting -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css"
    />
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <style>
      :root {
        --bg-main: #0b1018;
        --bg-card: #151c28;
        --bg-elevated: #1a2332;
        --bg-hover: #2a3548;
        --border-subtle: #263244;
        --text-main: #eef3f8;
        --text-muted: #9aa8ba;
        --text-soft: #c7d2e0;
        --accent: #4f8cff;
        --success: #10b981;
        --error: #f87171;
        --composer-height: 96px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background:
          radial-gradient(
            circle at top left,
            rgba(79, 140, 255, 0.12),
            transparent 34rem
          ),
          linear-gradient(180deg, #101827 0%, var(--bg-main) 36%);
        color: var(--text-main);
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }
      header {
        padding: 0.85rem 1.5rem;
        background-color: rgba(21, 28, 40, 0.88);
        border-bottom: 1px solid var(--border-subtle);
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
        backdrop-filter: blur(12px);
        z-index: 20;
      }
      #chat-window {
        flex: 1;
        overflow-y: auto;
        padding: 2rem clamp(1rem, 3vw, 2.75rem) 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1.1rem;
        scroll-behavior: smooth;
        scrollbar-gutter: stable;
      }
      .message {
        max-width: min(900px, 92%);
        padding: 1rem 1.15rem;
        border-radius: 0.85rem;
        line-height: 1.68;
        overflow-wrap: anywhere;
        position: relative;
        animation: fadeIn 0.18s ease-out;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .user {
        align-self: flex-end;
        max-width: min(720px, 86%);
        background: linear-gradient(180deg, #4f8cff, #2f6fea);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-bottom-right-radius: 0.3rem;
        line-height: 1.55;
      }
      .jarvis {
        align-self: flex-start;
        background: rgba(21, 28, 40, 0.94);
        border: 1px solid var(--border-subtle);
        border-bottom-left-radius: 0.3rem;
      }
      .jarvis.streaming::after {
        content: "";
        display: inline-block;
        width: 0.45rem;
        height: 0.45rem;
        margin: 0.35rem 0 0 0.2rem;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 0 0 rgba(79, 140, 255, 0.45);
        animation: typing-pulse 1.4s ease-out infinite;
      }
      @keyframes typing-pulse {
        0% {
          opacity: 0.35;
          box-shadow: 0 0 0 0 rgba(79, 140, 255, 0.35);
        }
        55% {
          opacity: 1;
          box-shadow: 0 0 0 0.45rem rgba(79, 140, 255, 0);
        }
        100% {
          opacity: 0.35;
          box-shadow: 0 0 0 0 rgba(79, 140, 255, 0);
        }
      }
      /* Markdown Styling */
      .markdown-body {
        color: var(--text-main);
        font-size: 0.98rem;
        line-height: 1.72;
      }
      .markdown-body pre {
        background-color: #07111f;
        border: 1px solid #223047;
        padding: 1rem 1.1rem;
        border-radius: 0.65rem;
        overflow-x: auto;
        margin: 1rem 0;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
        position: relative;
      }
      .markdown-body code {
        font-family: "Fira Code", "Cascadia Code", monospace;
        font-size: 0.9rem;
      }
      .markdown-body :not(pre) > code {
        background: rgba(79, 140, 255, 0.12);
        border: 1px solid rgba(79, 140, 255, 0.22);
        color: #dbeafe;
        padding: 0.1rem 0.32rem;
        border-radius: 0.35rem;
      }
      .code-copy-btn {
        position: sticky;
        left: calc(100% - 4.2rem);
        top: 0.25rem;
        float: right;
        min-width: 3.5rem;
        margin: -0.45rem -0.45rem 0.35rem 0.65rem;
        padding: 0.28rem 0.55rem;
        border-radius: 0.4rem;
        border: 1px solid rgba(148, 163, 184, 0.28);
        background: rgba(11, 16, 24, 0.92);
        color: var(--text-muted);
        font-size: 0.72rem;
        font-weight: 650;
        cursor: pointer;
      }
      .code-copy-btn:hover {
        color: #ffffff;
        background: rgba(79, 140, 255, 0.22);
      }
      .markdown-body .katex {
        color: inherit;
        font-size: 1.02em;
      }
      .markdown-body .katex-display {
        margin: 0.9rem 0;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 0.45rem 0.25rem;
      }
      .markdown-body .katex-display > .katex {
        text-align: left;
      }
      .markdown-body strong {
        font-weight: 700;
        color: #f8fafc;
      }
      .markdown-body h1,
      .markdown-body h2,
      .markdown-body h3,
      .markdown-body h4 {
        margin: 0.85rem 0 0.45rem;
        line-height: 1.3;
        font-weight: 700;
      }
      .markdown-body h1 {
        font-size: 1.46rem;
        border-bottom: 1px solid var(--border-subtle);
        padding-bottom: 0.35rem;
      }
      .markdown-body h2 {
        font-size: 1.28rem;
      }
      .markdown-body h3 {
        font-size: 1.14rem;
      }
      .markdown-body h4 {
        font-size: 1rem;
      }
      .markdown-body p {
        margin: 0.48rem 0;
      }
      .markdown-body ul,
      .markdown-body ol {
        padding-left: 1.45rem;
        margin: 0.55rem 0;
      }
      .markdown-body li {
        margin: 0.18rem 0;
      }
      .markdown-body blockquote {
        margin: 0.85rem 0;
        padding: 0.65rem 0.9rem;
        border-left: 3px solid var(--accent);
        background: rgba(79, 140, 255, 0.08);
        color: var(--text-soft);
        border-radius: 0 0.5rem 0.5rem 0;
      }
      .markdown-body table {
        width: 100%;
        border-collapse: collapse;
        display: block;
        overflow-x: auto;
        margin: 0.95rem 0;
        border: 1px solid var(--border-subtle);
        border-radius: 0.65rem;
      }
      .markdown-body th,
      .markdown-body td {
        border-bottom: 1px solid var(--border-subtle);
        padding: 0.55rem 0.7rem;
        text-align: left;
        vertical-align: top;
      }
      .markdown-body th {
        background: rgba(255, 255, 255, 0.04);
        color: #dbeafe;
        font-weight: 700;
      }
      .markdown-body tr:last-child td {
        border-bottom: 0;
      }

      .thought-container {
        background-color: rgba(11, 16, 24, 0.78);
        border-left: 3px solid #64748b;
        padding: 0.65rem 0.85rem;
        margin-bottom: 1rem;
        border-radius: 0.4rem;
        font-size: 0.9rem;
      }
      .thought-subject {
        font-weight: bold;
        color: var(--text-muted);
        margin-bottom: 0.25rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .thought-subject::before {
        content: "💭";
      }
      .thought-desc {
        font-style: italic;
        color: #64748b;
      }
      .tool-container {
        background-color: #07111f;
        border: 1px dashed #34435a;
        padding: 0.75rem 1rem;
        margin: 0.75rem 0;
        border-radius: 0.5rem;
        font-family: monospace;
        font-size: 0.85rem;
      }
      .tool-executing {
        border-color: var(--accent);
        animation: pulse-border 1.5s ease-in-out infinite;
      }
      @keyframes pulse-border {
        0%,
        100% {
          border-color: var(--accent);
          opacity: 1;
        }
        50% {
          border-color: var(--bg-hover);
          opacity: 0.6;
        }
      }
      .tool-header {
        color: var(--success);
        font-weight: bold;
        margin-bottom: 0.5rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .tool-output {
        color: var(--text-muted);
        max-height: 200px;
        overflow-y: auto;
        white-space: pre-wrap;
        background: #000;
        padding: 0.5rem;
        border-radius: 0.25rem;
      }
      #chat-panel footer {
        padding: 1rem clamp(1rem, 3vw, 2rem) 1.2rem;
        background: linear-gradient(
          180deg,
          rgba(11, 16, 24, 0),
          var(--bg-main) 24%
        );
        border-top: 1px solid rgba(38, 50, 68, 0.65);
        flex-shrink: 0;
      }
      .input-container {
        max-width: 940px;
        margin: 0 auto;
        display: flex;
        align-items: flex-end;
        gap: 0.75rem;
        background: rgba(21, 28, 40, 0.96);
        padding: 0.55rem;
        border-radius: 0.85rem;
        border: 1px solid var(--border-subtle);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.24);
      }
      textarea {
        flex: 1;
        background: transparent;
        border: none;
        color: white;
        padding: 0.75rem 1rem;
        outline: none;
        font-size: 1rem;
        resize: none;
        max-height: 200px;
        font-family: inherit;
        overflow-y: hidden;
      }
      button {
        background-color: var(--accent);
        color: white;
        border: none;
        padding: 0.72rem 1.25rem;
        border-radius: 0.55rem;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.2s;
      }
      button:hover:not(:disabled) {
        background-color: #2563eb;
        transform: translateY(-1px);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
        margin-right: 8px;
        box-shadow: 0 0 8px currentColor;
      }

      /* Confirmation Styles */
      .confirmation-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        backdrop-filter: blur(4px);
      }
      .confirmation-card {
        background: var(--bg-card);
        border: 1px solid var(--bg-hover);
        border-radius: 1rem;
        padding: 2rem;
        max-width: 500px;
        width: 90%;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      }
      .confirmation-title {
        font-size: 1.25rem;
        font-weight: bold;
        margin-bottom: 1rem;
        color: var(--error);
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .confirmation-body {
        color: var(--text-muted);
        margin-bottom: 2rem;
        line-height: 1.5;
        background: #011627;
        padding: 1rem;
        border-radius: 0.5rem;
        font-family: monospace;
      }
      .confirmation-actions {
        display: flex;
        gap: 1rem;
        justify-content: flex-end;
      }
      .btn-deny {
        background-color: var(--bg-hover);
      }
      .btn-allow {
        background-color: var(--error);
      }

      /* Ask-user form modal */
      .ask-user-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        backdrop-filter: blur(4px);
      }
      .ask-user-card {
        background: var(--bg-card);
        border: 1px solid var(--bg-hover);
        border-radius: 1rem;
        padding: 2rem;
        max-width: 560px;
        width: 94%;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      }
      .ask-user-title {
        font-size: 1.1rem;
        font-weight: bold;
        margin-bottom: 1.2rem;
        color: var(--accent);
      }
      .ask-user-question {
        margin-bottom: 1.2rem;
      }
      .ask-user-question label {
        display: block;
        font-size: 0.9rem;
        color: var(--text-muted);
        margin-bottom: 0.4rem;
      }
      .ask-user-question textarea,
      .ask-user-question input[type="text"] {
        width: 100%;
        background: #011627;
        border: 1px solid var(--bg-hover);
        border-radius: 0.5rem;
        color: var(--text);
        padding: 0.6rem 0.8rem;
        font-size: 0.95rem;
        resize: vertical;
        box-sizing: border-box;
      }
      .ask-user-question .radio-group {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }
      .ask-user-question .radio-group label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        cursor: pointer;
        color: var(--text);
      }
      .ask-user-actions {
        display: flex;
        gap: 1rem;
        justify-content: flex-end;
        margin-top: 1.5rem;
      }
      .btn-ask-cancel {
        background-color: var(--bg-hover);
      }
      .btn-ask-submit {
        background-color: var(--accent);
        color: #000;
      }

      /* ── Background Task Result Bubble ─────────────────────────── */
      .bg-task-result {
        max-width: min(900px, 92%);
        padding: 0;
        border-radius: 0.85rem;
        border-bottom-left-radius: 0.25rem;
        line-height: 1.6;
        word-wrap: break-word;
        position: relative;
        animation: fadeIn 0.3s ease-out;
        border: 1px solid rgba(79, 140, 255, 0.55);
        background-color: var(--bg-card);
        /* same layout as .message .jarvis */
        align-self: flex-start;
      }
      .bg-task-result.failed {
        border-color: var(--error);
      }
      .bg-task-header {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.6rem 1.25rem;
        background: #1d4ed8;
        border-radius: 0.875rem 0.875rem 0 0;
        font-size: 0.8rem;
        font-weight: 700;
        color: #fff;
      }
      .bg-task-result.failed .bg-task-header {
        background: #dc2626;
      }
      .bg-task-header .bg-task-id {
        font-family: monospace;
        font-weight: 400;
        opacity: 0.75;
        font-size: 0.72rem;
      }
      .bg-task-body {
        padding: 1.25rem;
        line-height: 1.6;
        color: var(--text-main);
      }

      /* ── Agent Tasks Panel ─────────────────────────────────── */
      #app-layout {
        display: flex;
        flex: 1;
        overflow: hidden;
      }
      #chat-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #tasks-panel {
        width: 360px;
        min-width: 360px;
        background: rgba(21, 28, 40, 0.98);
        border-left: 1px solid var(--border-subtle);
        display: flex;
        flex-direction: column;
        transition:
          width 0.25s ease,
          min-width 0.25s ease;
        overflow: hidden;
      }
      #tasks-panel.collapsed {
        width: 0;
        min-width: 0;
      }
      #tasks-panel-header {
        padding: 0.85rem 1rem;
        border-bottom: 1px solid var(--bg-hover);
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-weight: 600;
        font-size: 0.9rem;
        color: var(--text-muted);
        flex-shrink: 0;
      }
      #tasks-panel-header span {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      #task-count-badge {
        background: var(--accent);
        color: white;
        border-radius: 999px;
        font-size: 0.7rem;
        padding: 0.1rem 0.45rem;
        font-weight: 700;
        display: none;
      }
      #tasks-list {
        flex: 1;
        overflow-y: auto;
        padding: 0.75rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      #tasks-empty {
        color: var(--text-muted);
        font-size: 0.85rem;
        text-align: center;
        padding: 2rem 1rem;
      }
      .task-card {
        background: rgba(11, 16, 24, 0.72);
        border: 1px solid var(--border-subtle);
        border-radius: 0.7rem;
        padding: 0.9rem 1rem;
        font-size: 0.85rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .task-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .task-agent-name {
        font-weight: 600;
        color: var(--text-main);
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }
      .task-status-badge {
        font-size: 0.7rem;
        padding: 0.15rem 0.5rem;
        border-radius: 999px;
        font-weight: 600;
      }
      .task-status-pending {
        background: #334155;
        color: #94a3b8;
      }
      .task-status-starting {
        background: #1e3a5f;
        color: #60a5fa;
      }
      .task-status-running {
        background: #1a3a2e;
        color: #34d399;
        animation: pulse-text 1.5s ease-in-out infinite;
      }
      .task-status-input_required {
        background: #422006;
        color: #fb923c;
      }
      .task-status-completed {
        background: #1a3a2e;
        color: #10b981;
      }
      .task-status-failed {
        background: #3b0f0f;
        color: #f87171;
      }
      .task-status-cancelled {
        background: #1e293b;
        color: #64748b;
      }
      @keyframes pulse-text {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }
      .task-input-label {
        font-size: 0.75rem;
        color: var(--text-muted);
      }
      .task-output {
        background: #011627;
        border-radius: 0.5rem;
        padding: 0.6rem 0.75rem;
        max-height: 240px;
        overflow-y: auto;
        font-size: 0.78rem;
        line-height: 1.5;
        color: #cbd5e1;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .task-output.markdown-body {
        font-size: 0.78rem;
      }
      .task-output.markdown-body p {
        margin: 0.25rem 0;
      }
      .task-output.markdown-body pre {
        background: #000;
        padding: 0.5rem;
        border-radius: 0.25rem;
        overflow-x: auto;
      }
      .task-input-required-box {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.25rem;
      }
      .task-input-required-box input {
        flex: 1;
        background: var(--bg-hover);
        border: 1px solid #475569;
        border-radius: 0.4rem;
        color: white;
        padding: 0.4rem 0.6rem;
        font-size: 0.8rem;
        outline: none;
      }
      .task-input-required-box input:focus {
        border-color: var(--accent);
      }
      .task-btn-send {
        padding: 0.4rem 0.75rem;
        font-size: 0.8rem;
        border-radius: 0.4rem;
      }
      .task-btn-cancel {
        background: var(--bg-hover);
        color: var(--text-muted);
        border: none;
        padding: 0.25rem 0.6rem;
        border-radius: 0.4rem;
        cursor: pointer;
        font-size: 0.75rem;
      }
      .task-btn-cancel:hover {
        background: #3b0f0f;
        color: var(--error);
      }
      .task-time {
        font-size: 0.7rem;
        color: #475569;
      }
      /* Toggle button in header */
      #tasks-toggle-btn {
        background: var(--bg-hover);
        color: var(--text-muted);
        border: none;
        padding: 0.3rem 0.7rem;
        border-radius: 0.4rem;
        cursor: pointer;
        font-size: 0.8rem;
        font-weight: 600;
        transition: background 0.2s;
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }
      #tasks-toggle-btn:hover {
        background: var(--accent);
        color: white;
      }

      @media (max-width: 760px) {
        header {
          padding: 0.75rem 1rem;
        }
        #chat-window {
          padding: 1rem 0.8rem;
          gap: 0.85rem;
        }
        .message,
        .bg-task-result {
          max-width: 100%;
          width: 100%;
          border-radius: 0.75rem;
        }
        .user {
          width: auto;
          max-width: 92%;
        }
        #tasks-panel {
          position: absolute;
          right: 0;
          top: 0;
          bottom: 0;
          width: min(360px, 92vw);
          min-width: min(360px, 92vw);
          z-index: 30;
          box-shadow: -18px 0 40px rgba(0, 0, 0, 0.32);
        }
        #tasks-panel.collapsed {
          width: 0;
          min-width: 0;
        }
        #chat-panel footer {
          padding: 0.8rem;
        }
        .input-container {
          gap: 0.45rem;
        }
        button {
          padding: 0.7rem 0.9rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="ask-user-modal" class="ask-user-overlay">
      <div class="ask-user-card">
        <div class="ask-user-title">❓ Jarvis needs more information</div>
        <form id="ask-user-form">
          <div id="ask-user-questions"></div>
          <div class="ask-user-actions">
            <button type="button" id="btn-ask-cancel" class="btn-ask-cancel">
              Cancel
            </button>
            <button type="submit" id="btn-ask-submit" class="btn-ask-submit">
              Submit
            </button>
          </div>
        </form>
      </div>
    </div>

    <div id="confirmation-modal" class="confirmation-overlay">
      <div class="confirmation-card">
        <div class="confirmation-title">⚠️ Security Confirmation Required</div>
        <div id="confirmation-text" class="confirmation-body"></div>
        <div class="confirmation-actions">
          <button id="btn-deny" class="btn-deny">Deny</button>
          <button id="btn-allow" class="btn-allow">Allow Execution</button>
        </div>
      </div>
    </div>
    <header>
      <div
        style="
          font-size: 1.5rem;
          font-weight: bold;
          color: var(--accent);
          display: flex;
          align-items: center;
          gap: 0.5rem;
        "
      >
        <span>🤖</span> Jarvis
      </div>
      <div style="display: flex; align-items: center; gap: 1rem">
        <button id="tasks-toggle-btn" title="Toggle Agent Tasks Panel">
          🤖 Tasks <span id="task-count-badge-header"></span>
        </button>
        <div
          id="status-container"
          style="
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            background: var(--bg-main);
            padding: 0.4rem 0.8rem;
            border-radius: 2rem;
          "
        >
          <span
            id="status-dot"
            class="status-dot"
            style="color: var(--error); background-color: var(--error)"
          ></span>
          <span id="status-text">Disconnected</span>
        </div>
      </div>
    </header>

    <div id="app-layout">
      <div id="chat-panel">
        <div id="chat-window">
          <!-- Messages will be injected here -->
        </div>
        <footer>
          <form id="chat-form" class="input-container">
            <textarea
              id="user-input"
              placeholder="Ask Jarvis to do something..."
              autocomplete="off"
              rows="1"
            ></textarea>
            <button type="submit" id="send-btn">Send</button>
          </form>
        </footer>
      </div>

      <div id="tasks-panel" class="collapsed">
        <div id="tasks-panel-header">
          <span>🤖 Agent Tasks <span id="task-count-badge"></span></span>
          <button
            class="task-btn-cancel"
            id="tasks-close-btn"
            title="Close panel"
          >
            ✕
          </button>
        </div>
        <div id="tasks-list">
          <div id="tasks-empty">
            No active agent tasks.<br />Ask Jarvis to analyze a stock to get
            started.
          </div>
        </div>
      </div>
    </div>

    <script>
      const chatWindow = document.getElementById("chat-window");
      const chatForm = document.getElementById("chat-form");
      const userInput = document.getElementById("user-input");
      const statusText = document.getElementById("status-text");
      const statusDot = document.getElementById("status-dot");
      const sendBtn = document.getElementById("send-btn");
      const confirmationModal = document.getElementById("confirmation-modal");
      const confirmationText = document.getElementById("confirmation-text");
      const btnAllow = document.getElementById("btn-allow");
      const btnDeny = document.getElementById("btn-deny");

      // ── ask_user form ────────────────────────────────────────────────────
      const askUserModal = document.getElementById("ask-user-modal");
      const askUserForm = document.getElementById("ask-user-form");
      const askUserQuestions = document.getElementById("ask-user-questions");
      const btnAskCancel = document.getElementById("btn-ask-cancel");

      let activeAskUserId = null;
      let activeAskUserQuestions = [];

      function showAskUser(id, questions) {
        activeAskUserId = id;
        activeAskUserQuestions = questions;
        askUserQuestions.innerHTML = "";

        questions.forEach((q, i) => {
          const div = document.createElement("div");
          div.className = "ask-user-question";
          const label = document.createElement("label");
          label.textContent = q.question;

          const qType =
            q.type || (q.options && q.options.length > 0 ? "choice" : "text");

          if (qType === "yesno") {
            const btnGroup = document.createElement("div");
            btnGroup.className = "radio-group";
            ["Yes", "No", "Other"].forEach((val, j) => {
              const optLabel = document.createElement("label");
              const radio = document.createElement("input");
              radio.type = "radio";
              radio.name = `ask_q_${i}`;
              radio.value = val;
              if (j === 0) radio.checked = true;
              optLabel.appendChild(radio);
              optLabel.appendChild(document.createTextNode(` ${val}`));
              btnGroup.appendChild(optLabel);
            });
            // "Other" text input — shown only when Other is selected
            const otherInput = document.createElement("textarea");
            otherInput.name = `ask_q_${i}_other`;
            otherInput.rows = 2;
            otherInput.placeholder = q.placeholder || "请输入补充信息…";
            otherInput.style.display = "none";
            otherInput.style.marginTop = "0.5rem";
            btnGroup.querySelectorAll &&
              btnGroup.addEventListener("change", (e) => {
                const checked = btnGroup.querySelector(
                  'input[type="radio"]:checked',
                );
                otherInput.style.display =
                  checked && checked.value === "Other" ? "block" : "none";
              });
            div.appendChild(label);
            div.appendChild(btnGroup);
            div.appendChild(otherInput);
          } else if (qType === "choice" && q.options && q.options.length > 0) {
            const inputType = q.multiSelect ? "checkbox" : "radio";
            const group = document.createElement("div");
            group.className = "radio-group";
            q.options.forEach((opt, j) => {
              const optLabel = document.createElement("label");
              const input = document.createElement("input");
              input.type = inputType;
              input.name = `ask_q_${i}`;
              input.value = opt.label;
              if (!q.multiSelect && j === 0) input.checked = true;
              optLabel.appendChild(input);
              optLabel.appendChild(
                document.createTextNode(
                  ` ${opt.label}${opt.description ? " — " + opt.description : ""}`,
                ),
              );
              group.appendChild(optLabel);
            });
            div.appendChild(label);
            div.appendChild(group);
          } else {
            const textarea = document.createElement("textarea");
            textarea.name = `ask_q_${i}`;
            textarea.rows = 2;
            textarea.placeholder = q.placeholder || q.header || "";
            div.appendChild(label);
            div.appendChild(textarea);
          }
          askUserQuestions.appendChild(div);
        });

        askUserModal.style.display = "flex";
        // Focus first input
        const first = askUserQuestions.querySelector(
          'textarea, input[type="text"]',
        );
        if (first) first.focus();
      }

      function hideAskUser() {
        activeAskUserId = null;
        activeAskUserQuestions = [];
        askUserModal.style.display = "none";
      }

      askUserForm.addEventListener("submit", (e) => {
        e.preventDefault();
        if (!activeAskUserId || !ws) return;
        const answers = {};
        activeAskUserQuestions.forEach((q, i) => {
          const key = `${i}_${q.header || q.question.slice(0, 20)}`;
          if (q.multiSelect) {
            const checked = [
              ...askUserForm.querySelectorAll(
                `input[name="ask_q_${i}"]:checked`,
              ),
            ];
            answers[key] = checked.map((el) => el.value).join(", ");
          } else {
            const radio = askUserForm.querySelector(
              `input[name="ask_q_${i}"]:checked`,
            );
            const textarea = askUserForm.querySelector(
              `textarea[name="ask_q_${i}"]`,
            );
            const otherTextarea = askUserForm.querySelector(
              `textarea[name="ask_q_${i}_other"]`,
            );
            if (
              radio &&
              radio.value === "Other" &&
              otherTextarea &&
              otherTextarea.value.trim()
            ) {
              answers[key] = otherTextarea.value.trim();
            } else {
              answers[key] = radio
                ? radio.value
                : textarea
                  ? textarea.value.trim()
                  : "";
            }
          }
        });
        ws.send(
          JSON.stringify({
            type: "ask_user_response",
            id: activeAskUserId,
            answers,
          }),
        );
        hideAskUser();
      });

      btnAskCancel.addEventListener("click", () => {
        if (activeAskUserId && ws) {
          ws.send(
            JSON.stringify({
              type: "ask_user_response",
              id: activeAskUserId,
              answers: {},
              cancelled: true,
            }),
          );
        }
        hideAskUser();
      });
      // ────────────────────────────────────────────────────────────────────

      let activeConfirmationId = null;

      function showConfirmation(id, text) {
        activeConfirmationId = id;
        confirmationText.innerText = text;
        confirmationModal.style.display = "flex";
      }

      function hideConfirmation() {
        activeConfirmationId = null;
        confirmationModal.style.display = "none";
      }

      function sendConfirmation(decision) {
        if (!activeConfirmationId || !ws) return;
        ws.send(
          JSON.stringify({
            type: "confirmation",
            id: activeConfirmationId,
            decision: decision,
            sessionId: sessionId,
          }),
        );
        hideConfirmation();
      }

      btnAllow.onclick = () => sendConfirmation("allow");
      btnDeny.onclick = () => sendConfirmation("deny");

      function adjustHeight() {
        userInput.style.height = "auto";
        userInput.style.height = userInput.scrollHeight + "px";
        if (userInput.scrollHeight > 200) {
          userInput.style.overflowY = "auto";
        } else {
          userInput.style.overflowY = "hidden";
        }
      }

      userInput.addEventListener("input", adjustHeight);

      // Input history — shell-style ↑/↓ navigation, persisted in sessionStorage
      const HISTORY_KEY = "jarvis_input_history";
      const MAX_HISTORY = 200;
      let inputHistory = JSON.parse(
        sessionStorage.getItem(HISTORY_KEY) || "[]",
      );
      let historyIndex = -1; // -1 = current draft (not browsing history)
      let currentDraft = ""; // saves the draft while browsing

      function saveHistory(text) {
        if (!text.trim()) return;
        // Remove duplicate if same text already exists
        inputHistory = inputHistory.filter((h) => h !== text);
        inputHistory.push(text);
        if (inputHistory.length > MAX_HISTORY) inputHistory.shift();
        sessionStorage.setItem(HISTORY_KEY, JSON.stringify(inputHistory));
        historyIndex = -1;
      }

      userInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          chatForm.dispatchEvent(new Event("submit"));
          return;
        }
        if (e.key === "ArrowUp") {
          // Only navigate history when cursor is on the first line
          const lines = userInput.value
            .slice(0, userInput.selectionStart)
            .split("\n");
          if (lines.length > 1) return;
          e.preventDefault();
          if (inputHistory.length === 0) return;
          if (historyIndex === -1) {
            currentDraft = userInput.value;
            historyIndex = inputHistory.length - 1;
          } else if (historyIndex > 0) {
            historyIndex--;
          }
          userInput.value = inputHistory[historyIndex];
          adjustHeight();
          // Move cursor to end
          userInput.selectionStart = userInput.selectionEnd =
            userInput.value.length;
          return;
        }
        if (e.key === "ArrowDown") {
          if (historyIndex === -1) return;
          e.preventDefault();
          if (historyIndex < inputHistory.length - 1) {
            historyIndex++;
            userInput.value = inputHistory[historyIndex];
          } else {
            historyIndex = -1;
            userInput.value = currentDraft;
          }
          adjustHeight();
          userInput.selectionStart = userInput.selectionEnd =
            userInput.value.length;
          return;
        }
        // Any other key resets history browsing to current draft
        if (historyIndex !== -1 && e.key.length === 1) {
          historyIndex = -1;
        }
      });

      // ── Agent Tasks Panel ──────────────────────────────────────────────
      const tasksPanel = document.getElementById("tasks-panel");
      const tasksList = document.getElementById("tasks-list");
      const tasksEmpty = document.getElementById("tasks-empty");
      const tasksBadge = document.getElementById("task-count-badge");
      const tasksToggleBtn = document.getElementById("tasks-toggle-btn");
      const tasksCloseBtn = document.getElementById("tasks-close-btn");

      // Map: taskId → { card, outputEl, status, chunks }
      const taskCards = {};

      function toggleTasksPanel(open) {
        if (open === undefined)
          open = tasksPanel.classList.contains("collapsed");
        if (open) {
          tasksPanel.classList.remove("collapsed");
        } else {
          tasksPanel.classList.add("collapsed");
        }
      }

      tasksToggleBtn.onclick = () => toggleTasksPanel();
      tasksCloseBtn.onclick = () => toggleTasksPanel(false);

      function updateBadge() {
        const active = Object.values(taskCards).filter(
          (t) => !["completed", "failed", "cancelled"].includes(t.status),
        ).length;
        const total = Object.keys(taskCards).length;
        const label = total > 0 ? String(total) : "";
        tasksBadge.textContent = label;
        tasksBadge.style.display = label ? "inline" : "none";
        tasksToggleBtn.innerHTML = `🤖 Tasks${total > 0 ? ' <b style="color:var(--accent)">' + total + "</b>" : ""}`;
        tasksEmpty.style.display = total > 0 ? "none" : "block";
      }

      function formatTime(ms) {
        const d = new Date(ms);
        return d.toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        });
      }

      function esc(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function createTaskCard(task) {
        const tid = esc(task.taskId);
        const card = document.createElement("div");
        card.className = "task-card";
        card.id = "task-card-" + tid;
        // Use esc() for all agent-provided values to prevent stored XSS
        card.innerHTML = `
                <div class="task-card-header">
                    <div class="task-agent-name">🤖 <span class="agent-name-text">${esc(task.agentId)}</span></div>
                    <div style="display:flex;align-items:center;gap:0.4rem">
                        <span class="task-status-badge task-status-pending" id="badge-${tid}">pending</span>
                        <button class="task-btn-cancel" id="cancel-${tid}" title="Cancel task">✕</button>
                    </div>
                </div>
                <div class="task-input-label" id="input-label-${tid}">Input: ${esc(JSON.stringify(task.input || {}))}</div>
                <div class="task-output markdown-body" id="output-${tid}"></div>
                <div id="input-required-box-${tid}" style="display:none">
                    <div style="color:var(--error);font-size:0.78rem;margin-bottom:0.35rem" id="question-${tid}"></div>
                    <div class="task-input-required-box">
                        <input type="text" id="input-field-${tid}" placeholder="Your answer..." />
                        <button class="task-btn-send" id="input-send-${tid}">Send</button>
                    </div>
                </div>
                <div class="task-time">Started: ${esc(formatTime(task.createdAt || Date.now()))}</div>
            `;
        tasksList.prepend(card);

        // Cancel button
        document.getElementById("cancel-" + task.taskId).onclick = () => {
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(
              JSON.stringify({ type: "agent_cancel", taskId: task.taskId }),
            );
          }
        };

        // Input send button
        document.getElementById("input-send-" + task.taskId).onclick = () => {
          const val = document
            .getElementById("input-field-" + task.taskId)
            .value.trim();
          if (!val || !ws) return;
          ws.send(
            JSON.stringify({
              type: "agent_input",
              taskId: task.taskId,
              value: val,
            }),
          );
          document.getElementById(
            "input-required-box-" + task.taskId,
          ).style.display = "none";
          document.getElementById("input-field-" + task.taskId).value = "";
        };

        taskCards[task.taskId] = {
          card,
          status: "pending",
          chunks: "",
        };
        updateBadge();
        return card;
      }

      function setTaskStatus(taskId, status) {
        const entry = taskCards[taskId];
        if (!entry) return;
        entry.status = status;
        const badge = document.getElementById("badge-" + taskId);
        if (badge) {
          badge.className = "task-status-badge task-status-" + status;
          badge.textContent = status.replace("_", " ");
        }
        // Hide cancel button on terminal states
        if (["completed", "failed", "cancelled"].includes(status)) {
          const btn = document.getElementById("cancel-" + taskId);
          if (btn) btn.style.display = "none";
        }
        updateBadge();
      }

      function appendTaskChunk(taskId, chunk) {
        const entry = taskCards[taskId];
        if (!entry) return;
        entry.chunks += chunk;
        const outputEl = document.getElementById("output-" + taskId);
        if (outputEl) {
          renderMarkdown(outputEl, entry.chunks);
          outputEl.scrollTop = outputEl.scrollHeight;
        }
      }

      function showInputRequired(taskId, question) {
        setTaskStatus(taskId, "input_required");
        const box = document.getElementById("input-required-box-" + taskId);
        const qEl = document.getElementById("question-" + taskId);
        if (box) box.style.display = "block";
        if (qEl) qEl.textContent = "❓ " + question;
        // Focus the input field
        const field = document.getElementById("input-field-" + taskId);
        if (field) setTimeout(() => field.focus(), 100);
      }

      // On reconnect, fetch existing tasks from REST API
      function restoreTasks() {
        fetch("/api/agent-tasks?sessionId=" + sessionId)
          .then((r) => r.json())
          .then((tasks) => {
            tasks.forEach((task) => {
              if (taskCards[task.taskId]) return; // already tracked
              createTaskCard(task);
              setTaskStatus(task.taskId, task.status);
              // Prefer final output; fall back to stream chunks.
              // Never append both — avoids duplication on reconnect.
              if (task.output) {
                appendTaskChunk(task.taskId, task.output);
              } else if (task.streamChunks && task.streamChunks.length > 0) {
                task.streamChunks.forEach((c) =>
                  appendTaskChunk(task.taskId, c),
                );
              }
            });
            if (tasks.length > 0) toggleTasksPanel(true);
          })
          .catch(() => {}); // silent fail — server may not have tasks yet
      }
      // ── End Agent Tasks Panel ──────────────────────────────────────────

      let ws;
      let currentResponseEl = null;
      let currentMarkdownBuffer = "";
      let lastThoughtSubject = "";
      let streamingRenderTimer = null;
      let userPinnedToBottom = true;
      let markdownDiagnosticsEnabled =
        localStorage.getItem("jarvis_markdown_diagnostics") === "true";
      let markdownDiagnosticsMaxChars = 240;
      let markdownDiagnosticsChunkSampleRate = 0;
      let markdownRenderSeq = 0;
      let pendingFinalRenderDiagnostic = false;

      window.jarvisMarkdownDiagnostics = {
        enable() {
          localStorage.setItem("jarvis_markdown_diagnostics", "true");
          markdownDiagnosticsEnabled = true;
          console.info("[MarkdownDiagnostics] enabled");
        },
        disable() {
          localStorage.removeItem("jarvis_markdown_diagnostics");
          markdownDiagnosticsEnabled = false;
          console.info("[MarkdownDiagnostics] disabled");
        },
        status() {
          return {
            enabled: markdownDiagnosticsEnabled,
            maxChars: markdownDiagnosticsMaxChars,
            chunkSampleRate: markdownDiagnosticsChunkSampleRate,
          };
        },
        setChunkSampleRate(value) {
          markdownDiagnosticsChunkSampleRate = Math.max(0, Number(value) || 0);
          console.info("[MarkdownDiagnostics] chunkSampleRate", {
            value: markdownDiagnosticsChunkSampleRate,
          });
        },
      };

      fetch("/api/ui-config")
        .then((r) => (r.ok ? r.json() : null))
        .then((cfg) => {
          if (!cfg) return;
          markdownDiagnosticsEnabled =
            markdownDiagnosticsEnabled || cfg.markdownDiagnostics === true;
          markdownDiagnosticsMaxChars =
            Number(cfg.markdownDiagnosticsMaxChars) ||
            markdownDiagnosticsMaxChars;
          markdownDiagnosticsChunkSampleRate =
            Number(cfg.markdownDiagnosticsChunkSampleRate) ||
            markdownDiagnosticsChunkSampleRate;
          if (markdownDiagnosticsEnabled) {
            console.info("[MarkdownDiagnostics] active", {
              source:
                localStorage.getItem("jarvis_markdown_diagnostics") === "true"
                  ? "localStorage"
                  : "server-config",
              maxChars: markdownDiagnosticsMaxChars,
              chunkSampleRate: markdownDiagnosticsChunkSampleRate,
            });
          }
        })
        .catch(() => {});

      function diagnosticSnippet(
        value,
        maxChars = markdownDiagnosticsMaxChars,
      ) {
        const normalized = String(value || "")
          .replace(/\r/g, "\\r")
          .replace(/\n/g, "\\n");
        return normalized.length <= maxChars
          ? normalized
          : normalized.slice(0, maxChars) + "…";
      }

      function countMatches(value, pattern) {
        return String(value || "").match(pattern)?.length || 0;
      }

      function analyzeMarkdownPayload(value) {
        const text = String(value || "");
        const inlineMathDelimiters = countMatches(text, /(^|[^\\])\$(?!\$)/g);
        const displayMathDelimiters = countMatches(text, /(^|[^\\])\$\$/g);
        const escapedParenMathOpen = countMatches(text, /\\\(/g);
        const escapedParenMathClose = countMatches(text, /\\\)/g);
        const escapedBracketMathOpen = countMatches(text, /\\\[/g);
        const escapedBracketMathClose = countMatches(text, /\\\]/g);
        const fencedCodeDelimiters = countMatches(text, /```/g);
        const headingsNoSpace = countMatches(text, /^#{1,6}\S/gm);
        const likelyBrokenLatexCommands = countMatches(
          text,
          /\\(?:logpi|cdot|infty|gamma|sum|theta|lambda|delta|nabla)(?![a-zA-Z])/g,
        );
        const warnings = [
          ...(headingsNoSpace > 0 ? ["heading_without_space"] : []),
          ...(likelyBrokenLatexCommands > 0 ? ["broken_latex_command"] : []),
          ...(inlineMathDelimiters % 2 !== 0 ? ["unbalanced_inline_math"] : []),
          ...(displayMathDelimiters % 2 !== 0
            ? ["unbalanced_display_math"]
            : []),
          ...(escapedParenMathOpen !== escapedParenMathClose
            ? ["unbalanced_paren_math"]
            : []),
          ...(escapedBracketMathOpen !== escapedBracketMathClose
            ? ["unbalanced_bracket_math"]
            : []),
          ...(fencedCodeDelimiters % 2 !== 0 ? ["unbalanced_code_fence"] : []),
        ];
        return {
          chars: text.length,
          lines: text ? text.split(/\r?\n/).length : 0,
          dollars: countMatches(text, /\$/g),
          inlineMathDelimiters,
          displayMathDelimiters,
          escapedParenMathOpen,
          escapedParenMathClose,
          escapedBracketMathOpen,
          escapedBracketMathClose,
          fencedCodeDelimiters,
          headingsNoSpace,
          headingsWithSpace: countMatches(text, /^#{1,6}\s+\S/gm),
          likelyLatexCommands: countMatches(text, /\\[a-zA-Z]+/g),
          likelyBrokenLatexCommands,
          warnings,
          startsWith: diagnosticSnippet(
            text.slice(0, markdownDiagnosticsMaxChars),
          ),
          endsWith: diagnosticSnippet(text.slice(-markdownDiagnosticsMaxChars)),
        };
      }

      function analyzeRenderedMarkdown(targetEl) {
        return {
          htmlChars: targetEl.innerHTML.length,
          textChars: targetEl.innerText.length,
          katexCount: targetEl.querySelectorAll(".katex").length,
          katexDisplayCount: targetEl.querySelectorAll(".katex-display").length,
          codeBlockCount: targetEl.querySelectorAll("pre code").length,
          headingCount: targetEl.querySelectorAll("h1,h2,h3,h4,h5,h6").length,
          tableCount: targetEl.querySelectorAll("table").length,
          textStartsWith: diagnosticSnippet(
            targetEl.innerText.slice(0, markdownDiagnosticsMaxChars),
          ),
          textEndsWith: diagnosticSnippet(
            targetEl.innerText.slice(-markdownDiagnosticsMaxChars),
          ),
        };
      }

      function logMarkdownDiagnostic(stage, data) {
        if (!markdownDiagnosticsEnabled) return;
        console.groupCollapsed(`[MarkdownDiagnostics] ${stage}`);
        console.log(data);
        console.groupEnd();
      }

      function isNearChatBottom(threshold = 96) {
        return (
          chatWindow.scrollHeight -
            chatWindow.scrollTop -
            chatWindow.clientHeight <
          threshold
        );
      }

      function scrollChatToBottom() {
        chatWindow.scrollTop = chatWindow.scrollHeight;
      }

      function scrollChatToBottomIfPinned() {
        if (userPinnedToBottom) scrollChatToBottom();
      }

      chatWindow.addEventListener("scroll", () => {
        userPinnedToBottom = isNearChatBottom();
      });

      // Get or create Session ID
      let sessionId = localStorage.getItem("jarvis_session_id");
      if (!sessionId) {
        sessionId = "session-" + Math.random().toString(36).substr(2, 9);
        localStorage.setItem("jarvis_session_id", sessionId);
      }

      // Configure marked to use highlight.js when the CDN library is available.
      if (window.marked?.setOptions) {
        marked.setOptions({
          gfm: true,
          breaks: true,
          highlight: function (code, lang) {
            if (!window.hljs?.highlight) return code;
            const language = hljs.getLanguage(lang) ? lang : "plaintext";
            return hljs.highlight(code, { language }).value;
          },
          langPrefix: "hljs language-",
        });
      }

      function renderMarkdown(targetEl, markdown, options = {}) {
        const seq = ++markdownRenderSeq;
        const shouldLogRender =
          options.diagnosticStage === "final" ||
          options.diagnosticStage === "static";
        if (shouldLogRender) {
          logMarkdownDiagnostic(
            `client.${options.diagnosticStage}.render_input`,
            {
              seq,
              analysis: analyzeMarkdownPayload(markdown),
            },
          );
        }
        const prepared = prepareMarkdownForDisplay(markdown || "");
        if (shouldLogRender) {
          logMarkdownDiagnostic(
            `client.${options.diagnosticStage}.prepared_markdown`,
            {
              seq,
              markdownAnalysis: analyzeMarkdownPayload(prepared.markdown),
              mathSegments: prepared.mathSegments.map((segment, index) => ({
                index,
                analysis: analyzeMarkdownPayload(segment),
              })),
              strongSegments: prepared.strongSegments.length,
            },
          );
        }
        targetEl.innerHTML = restoreMathSegments(
          restoreStrongSegments(
            parseMarkdown(prepared.markdown),
            prepared.strongSegments,
          ),
          prepared.mathSegments,
        );
        if (window.hljs?.highlightElement) {
          targetEl
            .querySelectorAll("pre code")
            .forEach((el) => hljs.highlightElement(el));
        }
        enhanceCodeBlocks(targetEl);
        renderMath(targetEl);
        if (shouldLogRender) {
          logMarkdownDiagnostic(
            `client.${options.diagnosticStage}.render_output`,
            {
              seq,
              analysis: analyzeRenderedMarkdown(targetEl),
            },
          );
        }
      }

      function enhanceCodeBlocks(targetEl) {
        targetEl.querySelectorAll("pre").forEach((pre) => {
          if (pre.querySelector(".code-copy-btn")) return;
          const code = pre.querySelector("code");
          if (!code) return;
          const button = document.createElement("button");
          button.type = "button";
          button.className = "code-copy-btn";
          button.textContent = "Copy";
          button.addEventListener("click", async () => {
            const text = code.innerText || code.textContent || "";
            try {
              await navigator.clipboard.writeText(text);
              button.textContent = "Copied";
              setTimeout(() => {
                button.textContent = "Copy";
              }, 1200);
            } catch (_) {
              button.textContent = "Select";
              setTimeout(() => {
                button.textContent = "Copy";
              }, 1200);
            }
          });
          pre.insertBefore(button, pre.firstChild);
        });
      }

      function prepareMarkdownForDisplay(markdown) {
        const normalizedBareLatex = normalizeBareLatexOutsideFences(
          String(markdown),
        );
        const protectedMath = protectMathSegments(normalizedBareLatex);
        const protectedStrong = protectStrongSegments(
          normalizeMarkdownOutsideMath(protectedMath.markdown),
        );
        return {
          markdown: protectedStrong.markdown,
          mathSegments: protectedMath.mathSegments,
          strongSegments: protectedStrong.strongSegments,
        };
      }

      function normalizeBareLatexOutsideFences(markdown) {
        const lines = String(markdown).split(/(\r?\n)/);
        let inFence = false;
        return lines
          .map((part) => {
            if (/^\r?\n$/.test(part)) return part;
            const fenceMatch = part.match(/^\s*```/);
            if (fenceMatch) {
              inFence = !inFence;
              return part;
            }
            if (inFence) return part;
            return normalizeBareLatexLine(part);
          })
          .join("");
      }

      function normalizeBareLatexLine(line) {
        const text = String(line);
        const trimmed = text.trim();
        if (!trimmed || hasMathDelimiter(trimmed)) return text;
        if (!looksLikeStandaloneLatexExpression(trimmed)) return text;

        const leading = text.match(/^\s*/)?.[0] || "";
        const trailing = text.match(/\s*$/)?.[0] || "";
        const expression = repairCommonBareLatexShape(trimmed);
        return `${leading}\\[${expression}\\]${trailing}`;
      }

      function hasMathDelimiter(text) {
        return /(^|[^\\])(\$\$|\$|\\\(|\\\[)/.test(text);
      }

      function looksLikeStandaloneLatexExpression(text) {
        if (!/\\[A-Za-z]+/.test(text)) return false;
        if (!/[=_^{}]|\\(?:frac|sum|prod|int|sqrt|hat|bar|tilde|vec)\b/.test(text)) {
          return false;
        }
        if (/[。！？；，、]/.test(text)) return false;
        const proseWords = text.match(/[A-Za-z]{3,}/g) || [];
        const latexCommands = text.match(/\\[A-Za-z]+/g) || [];
        return proseWords.length <= latexCommands.length + 4;
      }

      function repairCommonBareLatexShape(expression) {
        return String(expression)
          .replace(
            /(\\(?:hat|bar|tilde|vec|dot|ddot)\{[^{}]+\})([A-Za-z0-9])/g,
            "$1_$2",
          )
          .replace(/(^|[^\\A-Za-z])([A-Za-z])\{([A-Za-z0-9]+)\}/g, "$1$2_{$3}");
      }

      function protectMathSegments(markdown) {
        const mathSegments = [];
        let result = "";
        let index = 0;

        const pushSegment = (start, end) => {
          const token = `JARVISMATH${mathSegments.length}TOKEN`;
          mathSegments.push(markdown.slice(start, end));
          result += markdown.slice(index, start) + token;
          index = end;
        };

        while (index < markdown.length) {
          const next = findNextMathDelimiter(markdown, index);
          if (!next) {
            result += markdown.slice(index);
            break;
          }
          const close = findMathClose(markdown, next.contentStart, next.close);
          if (close < 0) {
            result += markdown.slice(index);
            break;
          }
          pushSegment(next.start, close + next.close.length);
        }

        return { markdown: result, mathSegments };
      }

      function findNextMathDelimiter(markdown, fromIndex) {
        const delimiters = [
          { open: "$$", close: "$$" },
          { open: "\\[", close: "\\]" },
          { open: "\\(", close: "\\)" },
          { open: "$", close: "$" },
        ];
        let best = null;
        for (const delimiter of delimiters) {
          let start = markdown.indexOf(delimiter.open, fromIndex);
          while (start >= 0 && isEscaped(markdown, start)) {
            start = markdown.indexOf(
              delimiter.open,
              start + delimiter.open.length,
            );
          }
          if (
            start >= 0 &&
            (!best ||
              start < best.start ||
              delimiter.open.length > best.open.length)
          ) {
            best = {
              ...delimiter,
              start,
              contentStart: start + delimiter.open.length,
            };
          }
        }
        return best;
      }

      function findMathClose(markdown, fromIndex, closeDelimiter) {
        let close = markdown.indexOf(closeDelimiter, fromIndex);
        while (close >= 0 && isEscaped(markdown, close)) {
          close = markdown.indexOf(
            closeDelimiter,
            close + closeDelimiter.length,
          );
        }
        return close;
      }

      function isEscaped(text, index) {
        let slashCount = 0;
        for (let i = index - 1; i >= 0 && text[i] === "\\"; i--) slashCount++;
        return slashCount % 2 === 1;
      }

      function restoreMathSegments(html, mathSegments) {
        return mathSegments.reduce(
          (current, segment, index) =>
            current.replaceAll(`JARVISMATH${index}TOKEN`, () => segment),
          html,
        );
      }

      function normalizeMarkdownOutsideMath(markdown) {
        // Some model/tool paths escape markdown emphasis before it reaches the UI.
        // Keep LaTeX delimiters intact; only normalize markdown punctuation that
        // commonly appears in assistant prose.
        return String(markdown).replace(/\\([*#`])/g, "$1");
      }

      function protectStrongSegments(markdown) {
        const strongSegments = [];
        const protect = (content) => {
          const token = `JARVISSTRONG${strongSegments.length}TOKEN`;
          strongSegments.push(content);
          return token;
        };
        return {
          markdown: String(markdown)
            .replace(/\*\*([^*\n][\s\S]*?[^*\n])\*\*/g, (_, content) =>
              protect(content),
            )
            .replace(/__([^_\n][\s\S]*?[^_\n])__/g, (_, content) =>
              protect(content),
            ),
          strongSegments,
        };
      }

      function restoreStrongSegments(html, strongSegments) {
        return strongSegments.reduce(
          (current, segment, index) =>
            current.replaceAll(
              `JARVISSTRONG${index}TOKEN`,
              () => `<strong>${escapeHtml(segment)}</strong>`,
            ),
          html,
        );
      }

      function parseMarkdown(markdown) {
        if (window.marked?.parse) {
          try {
            return marked.parse(markdown);
          } catch (error) {
            console.warn(
              "marked.parse failed, using fallback markdown renderer:",
              error,
            );
          }
        }
        return fallbackMarkdownToHtml(markdown);
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function fallbackInlineMarkdown(text) {
        const codeSpans = [];
        let html = escapeHtml(text).replace(/`([^`]+)`/g, (_, code) => {
          const token = `@@CODE_SPAN_${codeSpans.length}@@`;
          codeSpans.push(`<code>${code}</code>`);
          return token;
        });

        html = html
          .replace(/\*\*([^*\n][\s\S]*?[^*\n])\*\*/g, "<strong>$1</strong>")
          .replace(/__([^_\n][\s\S]*?[^_\n])__/g, "<strong>$1</strong>")
          .replace(/\*([^*\n]+)\*/g, "<em>$1</em>")
          .replace(/_([^_\n]+)_/g, "<em>$1</em>");

        return html.replace(
          /@@CODE_SPAN_(\d+)@@/g,
          (_, index) => codeSpans[Number(index)] || "",
        );
      }

      function fallbackMarkdownToHtml(markdown) {
        const lines = String(markdown).split(/\r?\n/);
        const html = [];
        let paragraph = [];
        let listItems = [];
        let inFence = false;
        let fenceLang = "";
        let fenceLines = [];

        const flushParagraph = () => {
          if (paragraph.length === 0) return;
          html.push(`<p>${fallbackInlineMarkdown(paragraph.join("\n"))}</p>`);
          paragraph = [];
        };
        const flushList = () => {
          if (listItems.length === 0) return;
          html.push(
            `<ul>${listItems.map((item) => `<li>${fallbackInlineMarkdown(item)}</li>`).join("")}</ul>`,
          );
          listItems = [];
        };
        const flushFence = () => {
          const className = fenceLang
            ? ` class="language-${escapeHtml(fenceLang)}"`
            : "";
          html.push(
            `<pre><code${className}>${escapeHtml(fenceLines.join("\n"))}</code></pre>`,
          );
          fenceLines = [];
          fenceLang = "";
        };

        for (const line of lines) {
          const fenceMatch = line.match(/^```([\w-]+)?\s*$/);
          if (fenceMatch) {
            if (inFence) {
              flushFence();
              inFence = false;
            } else {
              flushParagraph();
              flushList();
              inFence = true;
              fenceLang = fenceMatch[1] || "";
            }
            continue;
          }
          if (inFence) {
            fenceLines.push(line);
            continue;
          }

          const headingMatch = line.match(/^(#{1,4})\s+(.+)$/);
          if (headingMatch) {
            flushParagraph();
            flushList();
            const level = headingMatch[1].length;
            html.push(
              `<h${level}>${fallbackInlineMarkdown(headingMatch[2])}</h${level}>`,
            );
            continue;
          }

          const listMatch = line.match(/^\s*[-*]\s+(.+)$/);
          if (listMatch) {
            flushParagraph();
            listItems.push(listMatch[1]);
            continue;
          }

          if (!line.trim()) {
            flushParagraph();
            flushList();
            continue;
          }
          flushList();
          paragraph.push(line);
        }

        if (inFence) flushFence();
        flushParagraph();
        flushList();
        return html.join("\n");
      }

      function renderMath(targetEl) {
        if (typeof renderMathInElement !== "function") return;

        renderMathInElement(targetEl, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "\\[", right: "\\]", display: true },
            { left: "$", right: "$", display: false },
            { left: "\\(", right: "\\)", display: false },
          ],
          ignoredTags: [
            "script",
            "noscript",
            "style",
            "textarea",
            "pre",
            "code",
          ],
          throwOnError: false,
        });
      }

      function appendMessage(role, content, isHistory = false) {
        const shouldFollow = userPinnedToBottom || !isHistory;
        const msgEl = document.createElement("div");
        msgEl.className = `message ${role}`;
        if (isHistory) msgEl.style.opacity = "0.7";

        const mdContainer = document.createElement("div");
        mdContainer.className = "markdown-body";
        renderMarkdown(mdContainer, content);
        msgEl.appendChild(mdContainer);

        chatWindow.appendChild(msgEl);
        if (shouldFollow) scrollChatToBottom();
      }

      function appendBgTaskResult(taskId, content, isFailed) {
        const wrap = document.createElement("div");
        wrap.className = "bg-task-result" + (isFailed ? " failed" : "");

        const header = document.createElement("div");
        header.className = "bg-task-header";
        header.innerHTML = isFailed
          ? `❌ 后台任务失败 <span class="bg-task-id">#${esc(taskId.slice(0, 8))}</span>`
          : `🔀 后台任务完成 <span class="bg-task-id">#${esc(taskId.slice(0, 8))}</span>`;

        const body = document.createElement("div");
        body.className = "bg-task-body markdown-body";
        try {
          renderMarkdown(
            body,
            isFailed ? `**错误：** ${esc(content)}` : content,
          );
        } catch (_) {
          body.textContent = content;
        }

        wrap.appendChild(header);
        wrap.appendChild(body);
        chatWindow.appendChild(wrap);
        scrollChatToBottomIfPinned();
      }

      function flushCurrentResponseRender() {
        if (!currentResponseEl) return;
        const mdContainer = currentResponseEl.querySelector(".markdown-body");
        if (!mdContainer) return;
        const diagnosticStage = pendingFinalRenderDiagnostic
          ? "final"
          : undefined;
        pendingFinalRenderDiagnostic = false;
        renderMarkdown(mdContainer, currentMarkdownBuffer, {
          diagnosticStage,
        });
        scrollChatToBottomIfPinned();
      }

      function scheduleCurrentResponseRender() {
        if (streamingRenderTimer) return;
        streamingRenderTimer = setTimeout(() => {
          streamingRenderTimer = null;
          flushCurrentResponseRender();
        }, 60);
      }

      function clearStreamingRenderTimer() {
        if (!streamingRenderTimer) return;
        clearTimeout(streamingRenderTimer);
        streamingRenderTimer = null;
      }

      function connect() {
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        ws = new WebSocket(`${protocol}//${window.location.host}`);

        ws.onopen = () => {
          statusText.innerText = "Online";
          statusDot.style.color = "var(--success)";
          statusDot.style.backgroundColor = "var(--success)";
          sendBtn.disabled = false;

          // Request history restoration
          ws.send(JSON.stringify({ type: "restore", sessionId: sessionId }));
          restoreTasks();
        };

        ws.onclose = () => {
          statusText.innerText = "Offline - Reconnecting...";
          statusDot.style.color = "var(--error)";
          statusDot.style.backgroundColor = "var(--error)";
          sendBtn.disabled = true;
          setTimeout(connect, 3000);
        };

        ws.onmessage = (event) => {
          const msg = JSON.parse(event.data);

          if (msg.type === "history") {
            chatWindow.innerHTML = "";
            msg.payload.forEach((m) => {
              appendMessage(m.role, m.content, true);
            });
            userPinnedToBottom = true;
            requestAnimationFrame(scrollChatToBottom);
          } else if (msg.type === "stream") {
            const eventData = msg.payload;
            if (eventData.type === "markdown_diagnostic") {
              logMarkdownDiagnostic(
                eventData.value?.stage || "server",
                eventData.value,
              );
              return;
            }

            // 🛡️ GLOBAL UI EVENTS (Do not create a message bubble)
            if (eventData.type === "confirmation_request") {
              showConfirmation(eventData.value.id, eventData.value.message);
              return; // Exit early, no bubble needed
            }
            if (eventData.type === "ask_user_request") {
              showAskUser(eventData.value.id, eventData.value.questions ?? []);
              return; // Exit early, no bubble needed
            }

            if (!currentResponseEl) {
              // NEW STREAM STARTED: Reset buffer to prevent duplication
              currentMarkdownBuffer = "";
              lastThoughtSubject = "";
              userPinnedToBottom = isNearChatBottom();

              currentResponseEl = document.createElement("div");
              currentResponseEl.className = "message jarvis streaming";
              const mdContainer = document.createElement("div");
              mdContainer.className = "markdown-body";
              currentResponseEl.appendChild(mdContainer);
              chatWindow.appendChild(currentResponseEl);
              scrollChatToBottomIfPinned();
            }

            const mdContainer =
              currentResponseEl.querySelector(".markdown-body");

            if (eventData.type === "content") {
              const nextChunkIndex =
                Number(currentResponseEl.dataset.chunkIndex || "0") + 1;
              currentResponseEl.dataset.chunkIndex = String(nextChunkIndex);
              const shouldSampleChunk =
                markdownDiagnosticsChunkSampleRate > 0 &&
                nextChunkIndex % markdownDiagnosticsChunkSampleRate === 0;
              if (shouldSampleChunk) {
                logMarkdownDiagnostic("client.content_chunk_sample", {
                  chunkIndex: nextChunkIndex,
                  analysis: analyzeMarkdownPayload(eventData.value),
                  bufferBeforeChars: currentMarkdownBuffer.length,
                });
              }
              currentMarkdownBuffer += eventData.value;
              scheduleCurrentResponseRender();
            } else if (eventData.type === "thought") {
              const thought = eventData.value;
              if (thought.subject !== lastThoughtSubject) {
                const thoughtContainer = document.createElement("div");
                thoughtContainer.className = "thought-container";
                thoughtContainer.innerHTML = `<div class="thought-subject">${thought.subject}</div><div class="thought-desc">${thought.description || ""}</div>`;
                currentResponseEl.insertBefore(thoughtContainer, mdContainer);
                lastThoughtSubject = thought.subject;
                scrollChatToBottomIfPinned();
              } else {
                const lastThoughtDesc = currentResponseEl.querySelector(
                  ".thought-container:last-child .thought-desc",
                );
                if (lastThoughtDesc && thought.description) {
                  lastThoughtDesc.innerText = thought.description;
                }
              }
            } else if (eventData.type === "confirmation_request") {
              showConfirmation(eventData.value.id, eventData.value.message);
            } else if (eventData.type === "tool_call_request") {
              const tool = eventData.value;
              const toolEl = document.createElement("div");
              toolEl.className = "tool-container tool-executing";
              toolEl.id = "tool-" + tool.callId;
              const argsStr = JSON.stringify(tool.args);
              toolEl.innerHTML = `<div class="tool-header">⏳ Executing ${tool.name}...</div><div class="tool-args" style="color: #64748b; font-size: 0.75rem; margin-bottom: 0.5rem;">${argsStr}</div>`;
              if (currentResponseEl) {
                currentResponseEl.insertBefore(toolEl, mdContainer);
              }
              scrollChatToBottomIfPinned();
            } else if (
              eventData.type === "tool_call_response" ||
              eventData.type === "tool_call_finished"
            ) {
              const toolResult = eventData.value;
              const toolEl =
                document.getElementById("tool-" + toolResult.callId) ||
                (currentResponseEl &&
                  currentResponseEl.querySelector(
                    ".tool-container:last-child",
                  ));
              if (toolEl) {
                toolEl.classList.remove("tool-executing");
                const header = toolEl.querySelector(".tool-header");
                if (header) header.textContent = "✅ " + toolResult.name;
                if (!toolEl.querySelector(".tool-output")) {
                  const out = document.createElement("div");
                  out.className = "tool-output";
                  out.style.cssText =
                    "color: var(--accent); font-size: 0.75rem; margin-top: 0.25rem; max-height: 6rem; overflow-y: auto;";
                  out.textContent = String(toolResult.output || "Done").slice(
                    0,
                    500,
                  );
                  toolEl.appendChild(out);
                }
              }
            }

            scrollChatToBottomIfPinned();
          } else if (msg.type === "done") {
            clearStreamingRenderTimer();
            pendingFinalRenderDiagnostic = true;
            flushCurrentResponseRender();
            if (currentResponseEl)
              currentResponseEl.classList.remove("streaming");
            currentResponseEl = null;
            currentMarkdownBuffer = "";
            lastThoughtSubject = "";
            sendBtn.disabled = false;
          } else if (msg.type === "error") {
            clearStreamingRenderTimer();
            if (currentResponseEl)
              currentResponseEl.classList.remove("streaming");
            currentResponseEl = null;
            currentMarkdownBuffer = "";
            lastThoughtSubject = "";
            const errorEl = document.createElement("div");
            errorEl.className = "message jarvis";
            errorEl.style.color = "var(--error)";
            errorEl.innerHTML = `<strong>Error:</strong> ${esc(msg.message)}`;
            chatWindow.appendChild(errorEl);
            scrollChatToBottomIfPinned();
            sendBtn.disabled = false;

            // ── Agent Task Events ──────────────────────────────────────
          } else if (msg.type === "agent_task_created") {
            createTaskCard(msg.task);
            toggleTasksPanel(true);
          } else if (msg.type === "agent_task_started") {
            setTaskStatus(msg.taskId, "starting");
          } else if (msg.type === "agent_task_stream") {
            setTaskStatus(msg.taskId, "running");
            appendTaskChunk(msg.taskId, msg.chunk);
          } else if (msg.type === "agent_task_done") {
            setTaskStatus(msg.taskId, "completed");
            if (msg.output && !taskCards[msg.taskId]?.chunks) {
              appendTaskChunk(msg.taskId, msg.output);
            }
          } else if (msg.type === "agent_task_failed") {
            setTaskStatus(msg.taskId, "failed");
            appendTaskChunk(
              msg.taskId,
              `\n\n❌ **Error:** ${esc(msg.error || "unknown")}`,
            );
          } else if (msg.type === "agent_task_cancelled") {
            setTaskStatus(msg.taskId, "cancelled");
          } else if (msg.type === "agent_input_required") {
            showInputRequired(msg.taskId, msg.question);

            // ── Background Task Events ─────────────────────────────────
          } else if (msg.type === "bg_task_done") {
            appendBgTaskResult(msg.taskId, msg.result || "(no output)", false);
          } else if (msg.type === "bg_task_failed") {
            appendBgTaskResult(msg.taskId, msg.error || "unknown error", true);
            // ── End Background Task Events ─────────────────────────────
            // ── End Agent Task Events ──────────────────────────────────
          }
        };
      }

      chatForm.onsubmit = (e) => {
        e.preventDefault();
        const text = userInput.value.trim();
        if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

        saveHistory(text);
        appendMessage("user", text);

        sendBtn.disabled = true;
        ws.send(
          JSON.stringify({
            type: "chat",
            payload: text,
            sessionId: sessionId,
          }),
        );
        userInput.value = "";
        userInput.style.height = "auto";
      };

      connect();
    </script>
  </body>
</html>
