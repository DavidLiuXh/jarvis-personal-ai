<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis - Personal AI Assistant</title>
    <!-- Libraries for Markdown and Highlighting -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --success: #10b981;
            --error: #f87171;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            padding: 1rem 2rem;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--bg-hover);
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            scroll-behavior: smooth;
        }
        .message {
            max-width: 90%;
            padding: 1.25rem;
            border-radius: 1rem;
            line-height: 1.6;
            word-wrap: break-word;
            position: relative;
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user {
            align-self: flex-end;
            background-color: var(--accent);
            color: white;
            border-bottom-right-radius: 0.25rem;
        }
        .jarvis {
            align-self: flex-start;
            background-color: var(--bg-card);
            border: 1px solid var(--bg-hover);
            border-bottom-left-radius: 0.25rem;
        }
        /* Markdown Styling */
        .markdown-body pre {
            background-color: #011627;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin: 1rem 0;
        }
        .markdown-body code {
            font-family: 'Fira Code', 'Cascadia Code', monospace;
            font-size: 0.9rem;
        }
        .markdown-body p { margin: 0.5rem 0; }
        .markdown-body ul, .markdown-body ol { padding-left: 1.5rem; }
        
        .thought-container {
            background-color: #0f172a;
            border-left: 4px solid #64748b;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            border-radius: 0.4rem;
            font-size: 0.9rem;
        }
        .thought-subject {
            font-weight: bold;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .thought-subject::before { content: '💭'; }
        .thought-desc {
            font-style: italic;
            color: #64748b;
        }
        .tool-container {
            background-color: #011627;
            border: 1px dashed var(--bg-hover);
            padding: 0.75rem 1rem;
            margin: 0.75rem 0;
            border-radius: 0.5rem;
            font-family: monospace;
            font-size: 0.85rem;
        }
        .tool-executing {
            border-color: var(--accent);
            animation: pulse-border 1.5s ease-in-out infinite;
        }
        @keyframes pulse-border {
            0%, 100% { border-color: var(--accent); opacity: 1; }
            50% { border-color: var(--bg-hover); opacity: 0.6; }
        }
        .tool-header {
            color: var(--success);
            font-weight: bold;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .tool-output {
            color: var(--text-muted);
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            background: #000;
            padding: 0.5rem;
            border-radius: 0.25rem;
        }
        #chat-panel footer {
            padding: 1.5rem 2rem;
            background-color: var(--bg-main);
            border-top: 1px solid var(--bg-hover);
            flex-shrink: 0;
        }
        .input-container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: flex-end;
            gap: 1rem;
            background: var(--bg-card);
            padding: 0.5rem;
            border-radius: 0.75rem;
            border: 1px solid var(--bg-hover);
        }
        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 0.75rem 1rem;
            outline: none;
            font-size: 1rem;
            resize: none;
            max-height: 200px;
            font-family: inherit;
            overflow-y: hidden;
        }
        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        button:hover:not(:disabled) {
            background-color: #2563eb;
            transform: translateY(-1px);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 8px currentColor;
        }

        /* Confirmation Styles */
        .confirmation-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .confirmation-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-hover);
            border-radius: 1rem;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .confirmation-title {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 1rem;
            color: var(--error);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .confirmation-body {
            color: var(--text-muted);
            margin-bottom: 2rem;
            line-height: 1.5;
            background: #011627;
            padding: 1rem;
            border-radius: 0.5rem;
            font-family: monospace;
        }
        .confirmation-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }
        .btn-deny { background-color: var(--bg-hover); }
        .btn-allow { background-color: var(--error); }

        /* Ask-user form modal */
        .ask-user-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .ask-user-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-hover);
            border-radius: 1rem;
            padding: 2rem;
            max-width: 560px;
            width: 94%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .ask-user-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 1.2rem;
            color: var(--accent);
        }
        .ask-user-question {
            margin-bottom: 1.2rem;
        }
        .ask-user-question label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
        }
        .ask-user-question textarea,
        .ask-user-question input[type="text"] {
            width: 100%;
            background: #011627;
            border: 1px solid var(--bg-hover);
            border-radius: 0.5rem;
            color: var(--text);
            padding: 0.6rem 0.8rem;
            font-size: 0.95rem;
            resize: vertical;
            box-sizing: border-box;
        }
        .ask-user-question .radio-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .ask-user-question .radio-group label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            color: var(--text);
        }
        .ask-user-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 1.5rem;
        }
        .btn-ask-cancel { background-color: var(--bg-hover); }
        .btn-ask-submit { background-color: var(--accent); color: #000; }

        /* ── Background Task Result Bubble ─────────────────────────── */
        .bg-task-result {
            max-width: 90%;
            padding: 0;
            border-radius: 1rem;
            border-bottom-left-radius: 0.25rem;
            line-height: 1.6;
            word-wrap: break-word;
            position: relative;
            animation: fadeIn 0.3s ease-out;
            border: 2px solid #3b82f6;
            background-color: var(--bg-card);
            /* same layout as .message .jarvis */
            align-self: flex-start;
        }
        .bg-task-result.failed {
            border-color: var(--error);
        }
        .bg-task-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.25rem;
            background: #1d4ed8;
            border-radius: 0.875rem 0.875rem 0 0;
            font-size: 0.8rem;
            font-weight: 700;
            color: #fff;
        }
        .bg-task-result.failed .bg-task-header {
            background: #dc2626;
        }
        .bg-task-header .bg-task-id {
            font-family: monospace;
            font-weight: 400;
            opacity: 0.75;
            font-size: 0.72rem;
        }
        .bg-task-body {
            padding: 1.25rem;
            line-height: 1.6;
            color: var(--text-main);
        }

        /* ── Agent Tasks Panel ─────────────────────────────────── */
        #app-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        #chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #tasks-panel {
            width: 360px;
            min-width: 360px;
            background: var(--bg-card);
            border-left: 1px solid var(--bg-hover);
            display: flex;
            flex-direction: column;
            transition: width 0.25s ease, min-width 0.25s ease;
            overflow: hidden;
        }
        #tasks-panel.collapsed {
            width: 0;
            min-width: 0;
        }
        #tasks-panel-header {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--bg-hover);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-muted);
            flex-shrink: 0;
        }
        #tasks-panel-header span { display: flex; align-items: center; gap: 0.5rem; }
        #task-count-badge {
            background: var(--accent);
            color: white;
            border-radius: 999px;
            font-size: 0.7rem;
            padding: 0.1rem 0.45rem;
            font-weight: 700;
            display: none;
        }
        #tasks-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        #tasks-empty {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
            padding: 2rem 1rem;
        }
        .task-card {
            background: var(--bg-main);
            border: 1px solid var(--bg-hover);
            border-radius: 0.75rem;
            padding: 0.9rem 1rem;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .task-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .task-agent-name {
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .task-status-badge {
            font-size: 0.7rem;
            padding: 0.15rem 0.5rem;
            border-radius: 999px;
            font-weight: 600;
        }
        .task-status-pending    { background: #334155; color: #94a3b8; }
        .task-status-starting   { background: #1e3a5f; color: #60a5fa; }
        .task-status-running    { background: #1a3a2e; color: #34d399;
                                  animation: pulse-text 1.5s ease-in-out infinite; }
        .task-status-input_required { background: #422006; color: #fb923c; }
        .task-status-completed  { background: #1a3a2e; color: #10b981; }
        .task-status-failed     { background: #3b0f0f; color: #f87171; }
        .task-status-cancelled  { background: #1e293b; color: #64748b; }
        @keyframes pulse-text {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .task-input-label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .task-output {
            background: #011627;
            border-radius: 0.5rem;
            padding: 0.6rem 0.75rem;
            max-height: 240px;
            overflow-y: auto;
            font-size: 0.78rem;
            line-height: 1.5;
            color: #cbd5e1;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .task-output.markdown-body {
            font-size: 0.78rem;
        }
        .task-output.markdown-body p { margin: 0.25rem 0; }
        .task-output.markdown-body pre {
            background: #000;
            padding: 0.5rem;
            border-radius: 0.25rem;
            overflow-x: auto;
        }
        .task-input-required-box {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.25rem;
        }
        .task-input-required-box input {
            flex: 1;
            background: var(--bg-hover);
            border: 1px solid #475569;
            border-radius: 0.4rem;
            color: white;
            padding: 0.4rem 0.6rem;
            font-size: 0.8rem;
            outline: none;
        }
        .task-input-required-box input:focus { border-color: var(--accent); }
        .task-btn-send {
            padding: 0.4rem 0.75rem;
            font-size: 0.8rem;
            border-radius: 0.4rem;
        }
        .task-btn-cancel {
            background: var(--bg-hover);
            color: var(--text-muted);
            border: none;
            padding: 0.25rem 0.6rem;
            border-radius: 0.4rem;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .task-btn-cancel:hover { background: #3b0f0f; color: var(--error); }
        .task-time {
            font-size: 0.7rem;
            color: #475569;
        }
        /* Toggle button in header */
        #tasks-toggle-btn {
            background: var(--bg-hover);
            color: var(--text-muted);
            border: none;
            padding: 0.3rem 0.7rem;
            border-radius: 0.4rem;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        #tasks-toggle-btn:hover { background: var(--accent); color: white; }
    </style>
</head>
<body>
    <div id="ask-user-modal" class="ask-user-overlay">
        <div class="ask-user-card">
            <div class="ask-user-title">❓ Jarvis needs more information</div>
            <form id="ask-user-form">
                <div id="ask-user-questions"></div>
                <div class="ask-user-actions">
                    <button type="button" id="btn-ask-cancel" class="btn-ask-cancel">Cancel</button>
                    <button type="submit" id="btn-ask-submit" class="btn-ask-submit">Submit</button>
                </div>
            </form>
        </div>
    </div>

    <div id="confirmation-modal" class="confirmation-overlay">
        <div class="confirmation-card">
            <div class="confirmation-title">⚠️ Security Confirmation Required</div>
            <div id="confirmation-text" class="confirmation-body"></div>
            <div class="confirmation-actions">
                <button id="btn-deny" class="btn-deny">Deny</button>
                <button id="btn-allow" class="btn-allow">Allow Execution</button>
            </div>
        </div>
    </div>
    <header>
        <div style="font-size: 1.5rem; font-weight: bold; color: var(--accent); display: flex; align-items: center; gap: 0.5rem;">
            <span>🤖</span> Jarvis
        </div>
        <div style="display: flex; align-items: center; gap: 1rem;">
            <button id="tasks-toggle-btn" title="Toggle Agent Tasks Panel">
                🤖 Tasks <span id="task-count-badge-header"></span>
            </button>
            <div id="status-container" style="font-size: 0.85rem; color: var(--text-muted); display: flex; align-items: center; background: var(--bg-main); padding: 0.4rem 0.8rem; border-radius: 2rem;">
                <span id="status-dot" class="status-dot" style="color: var(--error); background-color: var(--error);"></span>
                <span id="status-text">Disconnected</span>
            </div>
        </div>
    </header>

    <div id="app-layout">
        <div id="chat-panel">
            <div id="chat-window">
                <!-- Messages will be injected here -->
            </div>
            <footer>
                <form id="chat-form" class="input-container">
                    <textarea id="user-input" placeholder="Ask Jarvis to do something..." autocomplete="off" rows="1"></textarea>
                    <button type="submit" id="send-btn">Send</button>
                </form>
            </footer>
        </div>

        <div id="tasks-panel" class="collapsed">
            <div id="tasks-panel-header">
                <span>🤖 Agent Tasks <span id="task-count-badge"></span></span>
                <button class="task-btn-cancel" id="tasks-close-btn" title="Close panel">✕</button>
            </div>
            <div id="tasks-list">
                <div id="tasks-empty">No active agent tasks.<br>Ask Jarvis to analyze a stock to get started.</div>
            </div>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');
        const sendBtn = document.getElementById('send-btn');
        const confirmationModal = document.getElementById('confirmation-modal');
        const confirmationText = document.getElementById('confirmation-text');
        const btnAllow = document.getElementById('btn-allow');
        const btnDeny = document.getElementById('btn-deny');

        // ── ask_user form ────────────────────────────────────────────────────
        const askUserModal = document.getElementById('ask-user-modal');
        const askUserForm = document.getElementById('ask-user-form');
        const askUserQuestions = document.getElementById('ask-user-questions');
        const btnAskCancel = document.getElementById('btn-ask-cancel');

        let activeAskUserId = null;
        let activeAskUserQuestions = [];

        function showAskUser(id, questions) {
            activeAskUserId = id;
            activeAskUserQuestions = questions;
            askUserQuestions.innerHTML = '';

            questions.forEach((q, i) => {
                const div = document.createElement('div');
                div.className = 'ask-user-question';
                const label = document.createElement('label');
                label.textContent = q.question;

                if (q.options && q.options.length > 0) {
                    const radioGroup = document.createElement('div');
                    radioGroup.className = 'radio-group';
                    q.options.forEach((opt, j) => {
                        const optLabel = document.createElement('label');
                        const radio = document.createElement('input');
                        radio.type = 'radio';
                        radio.name = `ask_q_${i}`;
                        radio.value = opt.label;
                        if (j === 0) radio.checked = true;
                        optLabel.appendChild(radio);
                        optLabel.appendChild(document.createTextNode(` ${opt.label}${opt.description ? ' — ' + opt.description : ''}`));
                        radioGroup.appendChild(optLabel);
                    });
                    div.appendChild(label);
                    div.appendChild(radioGroup);
                } else {
                    const textarea = document.createElement('textarea');
                    textarea.name = `ask_q_${i}`;
                    textarea.rows = 2;
                    textarea.placeholder = q.placeholder || q.header || '';
                    div.appendChild(label);
                    div.appendChild(textarea);
                }
                askUserQuestions.appendChild(div);
            });

            askUserModal.style.display = 'flex';
            // Focus first input
            const first = askUserQuestions.querySelector('textarea, input[type="text"]');
            if (first) first.focus();
        }

        function hideAskUser() {
            activeAskUserId = null;
            activeAskUserQuestions = [];
            askUserModal.style.display = 'none';
        }

        askUserForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (!activeAskUserId || !ws) return;
            const answers = {};
            activeAskUserQuestions.forEach((q, i) => {
                const key = `${i}_${q.header || q.question.slice(0, 20)}`;
                const radio = askUserForm.querySelector(`input[name="ask_q_${i}"]:checked`);
                const textarea = askUserForm.querySelector(`textarea[name="ask_q_${i}"]`);
                answers[key] = radio ? radio.value : (textarea ? textarea.value.trim() : '');
            });
            ws.send(JSON.stringify({ type: 'ask_user_response', id: activeAskUserId, answers }));
            hideAskUser();
        });

        btnAskCancel.addEventListener('click', () => {
            if (activeAskUserId && ws) {
                ws.send(JSON.stringify({ type: 'ask_user_response', id: activeAskUserId, answers: {}, cancelled: true }));
            }
            hideAskUser();
        });
        // ────────────────────────────────────────────────────────────────────

        let activeConfirmationId = null;

        function showConfirmation(id, text) {
            activeConfirmationId = id;
            confirmationText.innerText = text;
            confirmationModal.style.display = 'flex';
        }

        function hideConfirmation() {
            activeConfirmationId = null;
            confirmationModal.style.display = 'none';
        }

        function sendConfirmation(decision) {
            if (!activeConfirmationId || !ws) return;
            ws.send(JSON.stringify({
                type: 'confirmation',
                id: activeConfirmationId,
                decision: decision,
                sessionId: sessionId
            }));
            hideConfirmation();
        }

        btnAllow.onclick = () => sendConfirmation('allow');
        btnDeny.onclick = () => sendConfirmation('deny');

        function adjustHeight() {
            userInput.style.height = 'auto';
            userInput.style.height = (userInput.scrollHeight) + 'px';
            if (userInput.scrollHeight > 200) {
                userInput.style.overflowY = 'auto';
            } else {
                userInput.style.overflowY = 'hidden';
            }
        }

        userInput.addEventListener('input', adjustHeight);

        // Input history — shell-style ↑/↓ navigation, persisted in sessionStorage
        const HISTORY_KEY = 'jarvis_input_history';
        const MAX_HISTORY = 200;
        let inputHistory = JSON.parse(sessionStorage.getItem(HISTORY_KEY) || '[]');
        let historyIndex = -1;   // -1 = current draft (not browsing history)
        let currentDraft = '';   // saves the draft while browsing

        function saveHistory(text) {
            if (!text.trim()) return;
            // Remove duplicate if same text already exists
            inputHistory = inputHistory.filter(h => h !== text);
            inputHistory.push(text);
            if (inputHistory.length > MAX_HISTORY) inputHistory.shift();
            sessionStorage.setItem(HISTORY_KEY, JSON.stringify(inputHistory));
            historyIndex = -1;
        }

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
                return;
            }
            if (e.key === 'ArrowUp') {
                // Only navigate history when cursor is on the first line
                const lines = userInput.value.slice(0, userInput.selectionStart).split('\n');
                if (lines.length > 1) return;
                e.preventDefault();
                if (inputHistory.length === 0) return;
                if (historyIndex === -1) {
                    currentDraft = userInput.value;
                    historyIndex = inputHistory.length - 1;
                } else if (historyIndex > 0) {
                    historyIndex--;
                }
                userInput.value = inputHistory[historyIndex];
                adjustHeight();
                // Move cursor to end
                userInput.selectionStart = userInput.selectionEnd = userInput.value.length;
                return;
            }
            if (e.key === 'ArrowDown') {
                if (historyIndex === -1) return;
                e.preventDefault();
                if (historyIndex < inputHistory.length - 1) {
                    historyIndex++;
                    userInput.value = inputHistory[historyIndex];
                } else {
                    historyIndex = -1;
                    userInput.value = currentDraft;
                }
                adjustHeight();
                userInput.selectionStart = userInput.selectionEnd = userInput.value.length;
                return;
            }
            // Any other key resets history browsing to current draft
            if (historyIndex !== -1 && e.key.length === 1) {
                historyIndex = -1;
            }
        });

        // ── Agent Tasks Panel ──────────────────────────────────────────────
        const tasksPanel    = document.getElementById('tasks-panel');
        const tasksList     = document.getElementById('tasks-list');
        const tasksEmpty    = document.getElementById('tasks-empty');
        const tasksBadge    = document.getElementById('task-count-badge');
        const tasksToggleBtn = document.getElementById('tasks-toggle-btn');
        const tasksCloseBtn  = document.getElementById('tasks-close-btn');

        // Map: taskId → { card, outputEl, status, chunks }
        const taskCards = {};

        function toggleTasksPanel(open) {
            if (open === undefined) open = tasksPanel.classList.contains('collapsed');
            if (open) {
                tasksPanel.classList.remove('collapsed');
            } else {
                tasksPanel.classList.add('collapsed');
            }
        }

        tasksToggleBtn.onclick = () => toggleTasksPanel();
        tasksCloseBtn.onclick  = () => toggleTasksPanel(false);

        function updateBadge() {
            const active = Object.values(taskCards).filter(
                t => !['completed','failed','cancelled'].includes(t.status)
            ).length;
            const total  = Object.keys(taskCards).length;
            const label  = total > 0 ? String(total) : '';
            tasksBadge.textContent = label;
            tasksBadge.style.display = label ? 'inline' : 'none';
            tasksToggleBtn.innerHTML =
                `🤖 Tasks${total > 0 ? ' <b style="color:var(--accent)">'+total+'</b>' : ''}`;
            tasksEmpty.style.display = total > 0 ? 'none' : 'block';
        }

        function formatTime(ms) {
            const d = new Date(ms);
            return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
        }

        function esc(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function createTaskCard(task) {
            const tid = esc(task.taskId);
            const card = document.createElement('div');
            card.className = 'task-card';
            card.id = 'task-card-' + tid;
            // Use esc() for all agent-provided values to prevent stored XSS
            card.innerHTML = `
                <div class="task-card-header">
                    <div class="task-agent-name">🤖 <span class="agent-name-text">${esc(task.agentId)}</span></div>
                    <div style="display:flex;align-items:center;gap:0.4rem">
                        <span class="task-status-badge task-status-pending" id="badge-${tid}">pending</span>
                        <button class="task-btn-cancel" id="cancel-${tid}" title="Cancel task">✕</button>
                    </div>
                </div>
                <div class="task-input-label" id="input-label-${tid}">Input: ${esc(JSON.stringify(task.input || {}))}</div>
                <div class="task-output markdown-body" id="output-${tid}"></div>
                <div id="input-required-box-${tid}" style="display:none">
                    <div style="color:var(--error);font-size:0.78rem;margin-bottom:0.35rem" id="question-${tid}"></div>
                    <div class="task-input-required-box">
                        <input type="text" id="input-field-${tid}" placeholder="Your answer..." />
                        <button class="task-btn-send" id="input-send-${tid}">Send</button>
                    </div>
                </div>
                <div class="task-time">Started: ${esc(formatTime(task.createdAt || Date.now()))}</div>
            `;
            tasksList.prepend(card);

            // Cancel button
            document.getElementById('cancel-' + task.taskId).onclick = () => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'agent_cancel', taskId: task.taskId }));
                }
            };

            // Input send button
            document.getElementById('input-send-' + task.taskId).onclick = () => {
                const val = document.getElementById('input-field-' + task.taskId).value.trim();
                if (!val || !ws) return;
                ws.send(JSON.stringify({ type: 'agent_input', taskId: task.taskId, value: val }));
                document.getElementById('input-required-box-' + task.taskId).style.display = 'none';
                document.getElementById('input-field-' + task.taskId).value = '';
            };

            taskCards[task.taskId] = {
                card,
                status: 'pending',
                chunks: '',
            };
            updateBadge();
            return card;
        }

        function setTaskStatus(taskId, status) {
            const entry = taskCards[taskId];
            if (!entry) return;
            entry.status = status;
            const badge = document.getElementById('badge-' + taskId);
            if (badge) {
                badge.className = 'task-status-badge task-status-' + status;
                badge.textContent = status.replace('_', ' ');
            }
            // Hide cancel button on terminal states
            if (['completed','failed','cancelled'].includes(status)) {
                const btn = document.getElementById('cancel-' + taskId);
                if (btn) btn.style.display = 'none';
            }
            updateBadge();
        }

        function appendTaskChunk(taskId, chunk) {
            const entry = taskCards[taskId];
            if (!entry) return;
            entry.chunks += chunk;
            const outputEl = document.getElementById('output-' + taskId);
            if (outputEl) {
                outputEl.innerHTML = marked.parse(entry.chunks);
                outputEl.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
                outputEl.scrollTop = outputEl.scrollHeight;
            }
        }

        function showInputRequired(taskId, question) {
            setTaskStatus(taskId, 'input_required');
            const box = document.getElementById('input-required-box-' + taskId);
            const qEl = document.getElementById('question-' + taskId);
            if (box) box.style.display = 'block';
            if (qEl) qEl.textContent = '❓ ' + question;
            // Focus the input field
            const field = document.getElementById('input-field-' + taskId);
            if (field) setTimeout(() => field.focus(), 100);
        }

        // On reconnect, fetch existing tasks from REST API
        function restoreTasks() {
            fetch('/api/agent-tasks?sessionId=' + sessionId)
                .then(r => r.json())
                .then(tasks => {
                    tasks.forEach(task => {
                        if (taskCards[task.taskId]) return; // already tracked
                        createTaskCard(task);
                        setTaskStatus(task.taskId, task.status);
                        // Prefer final output; fall back to stream chunks.
                        // Never append both — avoids duplication on reconnect.
                        if (task.output) {
                            appendTaskChunk(task.taskId, task.output);
                        } else if (task.streamChunks && task.streamChunks.length > 0) {
                            task.streamChunks.forEach(c => appendTaskChunk(task.taskId, c));
                        }
                    });
                    if (tasks.length > 0) toggleTasksPanel(true);
                })
                .catch(() => {}); // silent fail — server may not have tasks yet
        }
        // ── End Agent Tasks Panel ──────────────────────────────────────────

        let ws;
        let currentResponseEl = null;
        let currentMarkdownBuffer = '';
        let lastThoughtSubject = '';

        // Get or create Session ID
        let sessionId = localStorage.getItem('jarvis_session_id');
        if (!sessionId) {
            sessionId = 'session-' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('jarvis_session_id', sessionId);
        }

        // Configure marked to use highlight.js
        marked.setOptions({
            highlight: function(code, lang) {
                const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                return hljs.highlight(code, { language }).value;
            },
            langPrefix: 'hljs language-'
        });

        function appendMessage(role, content, isHistory = false) {
            const msgEl = document.createElement('div');
            msgEl.className = `message ${role}`;
            if (isHistory) msgEl.style.opacity = '0.7';

            const mdContainer = document.createElement('div');
            mdContainer.className = 'markdown-body';
            mdContainer.innerHTML = marked.parse(content);
            msgEl.appendChild(mdContainer);

            chatWindow.appendChild(msgEl);
            mdContainer.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function appendBgTaskResult(taskId, content, isFailed) {
            const wrap = document.createElement('div');
            wrap.className = 'bg-task-result' + (isFailed ? ' failed' : '');

            const header = document.createElement('div');
            header.className = 'bg-task-header';
            header.innerHTML = isFailed
                ? `❌ 后台任务失败 <span class="bg-task-id">#${esc(taskId.slice(0, 8))}</span>`
                : `🔀 后台任务完成 <span class="bg-task-id">#${esc(taskId.slice(0, 8))}</span>`;

            const body = document.createElement('div');
            body.className = 'bg-task-body markdown-body';
            try {
                body.innerHTML = marked.parse(isFailed ? `**错误：** ${esc(content)}` : content);
                body.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
            } catch(_) {
                body.textContent = content;
            }

            wrap.appendChild(header);
            wrap.appendChild(body);
            chatWindow.appendChild(wrap);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}`);

            ws.onopen = () => {
                statusText.innerText = 'Online';
                statusDot.style.color = 'var(--success)';
                statusDot.style.backgroundColor = 'var(--success)';
                sendBtn.disabled = false;
                
                // Request history restoration
                ws.send(JSON.stringify({ type: 'restore', sessionId: sessionId }));
                restoreTasks();
            };

            ws.onclose = () => {
                statusText.innerText = 'Offline - Reconnecting...';
                statusDot.style.color = 'var(--error)';
                statusDot.style.backgroundColor = 'var(--error)';
                sendBtn.disabled = true;
                setTimeout(connect, 3000);
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);

                if (msg.type === 'history') {
                    chatWindow.innerHTML = '';
                    msg.payload.forEach(m => {
                        appendMessage(m.role, m.content, true);
                    });
                }
                else if (msg.type === 'stream') {
                    const eventData = msg.payload;

                    // 🛡️ GLOBAL UI EVENTS (Do not create a message bubble)
                    if (eventData.type === 'confirmation_request') {
                        showConfirmation(eventData.value.id, eventData.value.message);
                        return; // Exit early, no bubble needed
                    }
                    if (eventData.type === 'ask_user_request') {
                        showAskUser(eventData.value.id, eventData.value.questions ?? []);
                        return; // Exit early, no bubble needed
                    }

                    if (!currentResponseEl) {
                        // NEW STREAM STARTED: Reset buffer to prevent duplication
                        currentMarkdownBuffer = '';
                        lastThoughtSubject = '';
                        
                        currentResponseEl = document.createElement('div');
                        currentResponseEl.className = 'message jarvis';
                        const mdContainer = document.createElement('div');
                        mdContainer.className = 'markdown-body';
                        currentResponseEl.appendChild(mdContainer);
                        chatWindow.appendChild(currentResponseEl);
                    }

                    const mdContainer = currentResponseEl.querySelector('.markdown-body');

                    if (eventData.type === 'content') {
                        // Prevent identical back-to-back chunks if the model/server glitches
                        if (currentMarkdownBuffer.endsWith(eventData.value)) {
                            console.warn('Deduplicated identical chunk:', eventData.value);
                            return;
                        }
                        
                        currentMarkdownBuffer += eventData.value;
                        mdContainer.innerHTML = marked.parse(currentMarkdownBuffer);
                        mdContainer.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
                    } 
                    else if (eventData.type === 'thought') {
                        const thought = eventData.value;
                        if (thought.subject !== lastThoughtSubject) {
                            const thoughtContainer = document.createElement('div');
                            thoughtContainer.className = 'thought-container';
                            thoughtContainer.innerHTML = `<div class="thought-subject">${thought.subject}</div><div class="thought-desc">${thought.description || ''}</div>`;
                            currentResponseEl.insertBefore(thoughtContainer, mdContainer);
                            lastThoughtSubject = thought.subject;
                        } else {
                            const lastThoughtDesc = currentResponseEl.querySelector('.thought-container:last-child .thought-desc');
                            if (lastThoughtDesc && thought.description) {
                                lastThoughtDesc.innerText = thought.description;
                            }
                        }
                    }
                    else if (eventData.type === 'confirmation_request') {
                        showConfirmation(eventData.value.id, eventData.value.message);
                    }
                    else if (eventData.type === 'tool_call_request') {
                        const tool = eventData.value;
                        const toolEl = document.createElement('div');
                        toolEl.className = 'tool-container tool-executing';
                        toolEl.id = 'tool-' + tool.callId;
                        const argsStr = JSON.stringify(tool.args);
                        toolEl.innerHTML = `<div class="tool-header">⏳ Executing ${tool.name}...</div><div class="tool-args" style="color: #64748b; font-size: 0.75rem; margin-bottom: 0.5rem;">${argsStr}</div>`;
                        if (currentResponseEl) {
                            currentResponseEl.insertBefore(toolEl, mdContainer);
                        }
                        chatWindow.scrollTop = chatWindow.scrollHeight;
                    }
                    else if (eventData.type === 'tool_call_response' || eventData.type === 'tool_call_finished') {
                        const toolResult = eventData.value;
                        const toolEl = document.getElementById('tool-' + toolResult.callId) || (currentResponseEl && currentResponseEl.querySelector('.tool-container:last-child'));
                        if (toolEl) {
                            toolEl.classList.remove('tool-executing');
                            const header = toolEl.querySelector('.tool-header');
                            if (header) header.textContent = '✅ ' + toolResult.name;
                            if (!toolEl.querySelector('.tool-output')) {
                                const out = document.createElement('div');
                                out.className = 'tool-output';
                                out.style.cssText = 'color: var(--accent); font-size: 0.75rem; margin-top: 0.25rem; max-height: 6rem; overflow-y: auto;';
                                out.textContent = String(toolResult.output || 'Done').slice(0, 500);
                                toolEl.appendChild(out);
                            }
                        }
                    }
                    
                    chatWindow.scrollTop = chatWindow.scrollHeight;
                } else if (msg.type === 'done') {
                    currentResponseEl = null;
                    currentMarkdownBuffer = '';
                    lastThoughtSubject = '';
                    sendBtn.disabled = false;
                } else if (msg.type === 'error') {
                    const errorEl = document.createElement('div');
                    errorEl.className = 'message jarvis';
                    errorEl.style.color = 'var(--error)';
                    errorEl.innerHTML = `<strong>Error:</strong> ${msg.message}`;
                    chatWindow.appendChild(errorEl);
                    sendBtn.disabled = false;

                // ── Agent Task Events ──────────────────────────────────────
                } else if (msg.type === 'agent_task_created') {
                    createTaskCard(msg.task);
                    toggleTasksPanel(true);

                } else if (msg.type === 'agent_task_started') {
                    setTaskStatus(msg.taskId, 'starting');

                } else if (msg.type === 'agent_task_stream') {
                    setTaskStatus(msg.taskId, 'running');
                    appendTaskChunk(msg.taskId, msg.chunk);

                } else if (msg.type === 'agent_task_done') {
                    setTaskStatus(msg.taskId, 'completed');
                    if (msg.output && !taskCards[msg.taskId]?.chunks) {
                        appendTaskChunk(msg.taskId, msg.output);
                    }

                } else if (msg.type === 'agent_task_failed') {
                    setTaskStatus(msg.taskId, 'failed');
                    appendTaskChunk(msg.taskId, `\n\n❌ **Error:** ${esc(msg.error || 'unknown')}`);

                } else if (msg.type === 'agent_task_cancelled') {
                    setTaskStatus(msg.taskId, 'cancelled');

                } else if (msg.type === 'agent_input_required') {
                    showInputRequired(msg.taskId, msg.question);

                // ── Background Task Events ─────────────────────────────────
                } else if (msg.type === 'bg_task_done') {
                    appendBgTaskResult(msg.taskId, msg.result || '(no output)', false);

                } else if (msg.type === 'bg_task_failed') {
                    appendBgTaskResult(msg.taskId, msg.error || 'unknown error', true);
                // ── End Background Task Events ─────────────────────────────
                // ── End Agent Task Events ──────────────────────────────────
                }
            };
        }

        chatForm.onsubmit = (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

            saveHistory(text);
            appendMessage('user', text);

            sendBtn.disabled = true;
            ws.send(JSON.stringify({
                type: 'chat',
                payload: text,
                sessionId: sessionId
            }));
            userInput.value = '';
            userInput.style.height = 'auto';
        };

        connect();
    </script>
</body>
</html>
